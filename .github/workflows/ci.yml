name: CI

on:
  push:
    # ci-package exists to drive the AppImage job below. workflow_dispatch only
    # offers the default branch's copy of this file, and this workflow does not
    # live there yet, so pushing a branch is the one trigger available.
    branches: [dx, ci-package]
    tags: ['v*']
  pull_request:
    branches: [dx]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shell:
    name: Shell unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-shell

  deps:
    name: Deps preflight (${{ matrix.slug }})
    # Gated on the shell suite: it takes seconds and catches build-logic
    # breakage, so there is no point spinning up five distro containers behind
    # an already-failing tree.
    needs: shell
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12",     slug: "debian-12",     experimental: false }
          - { image: "debian:13",     slug: "debian-13",     experimental: false }
          - { image: "fedora:41",     slug: "fedora-41",     experimental: false }
          - { image: "ubuntu:22.04",  slug: "ubuntu-2204",   experimental: false }
          - { image: "ubuntu:24.04",  slug: "ubuntu-2404",   experimental: false }
    steps:
      - name: Install minimal bootstrap tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git make ca-certificates
          elif command -v dnf >/dev/null; then
            dnf install -y git make
          fi
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
      - name: Capture dependency diagnostics
        run: make deps-doctor | tee "deps-doctor-${{ matrix.slug }}.txt"
      - name: Upload diagnostics for doc harvesting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deps-doctor-${{ matrix.slug }}
          path: deps-doctor-${{ matrix.slug }}.txt
      - name: Install declared dependencies
        run: make deps
      - name: Re-run shell unit tests on this release
        run: make test-shell

  build:
    name: Build (${{ matrix.slug }})
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "debian:12",     slug: "debian-12",     experimental: false }
          - { image: "fedora:41",     slug: "fedora-41",     experimental: false }
          - { image: "ubuntu:24.04",  slug: "ubuntu-2404",   experimental: false }
    steps:
      - name: Install minimal bootstrap tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            apt-get install -y --no-install-recommends git make ca-certificates
          elif command -v dnf >/dev/null; then
            dnf install -y git make
          fi
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            archive
          key: build-${{ matrix.slug }}-${{ hashFiles('make/**/*.mk', 'Makefile') }}
          restore-keys: |
            build-${{ matrix.slug }}-
      - name: Bootstrap (deps, ffmpeg, libstb-hal, neutrino)
        run: make bootstrap
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ matrix.slug }}
          path: |
            **/config.log
            logs/**
          if-no-files-found: ignore

  appimage:
    name: AppImage (build, package, verify)
    # Gated on the shell suite for the same reason as deps: this job takes the
    # better part of an hour and there is no point starting it behind a tree
    # that already fails in seconds.
    needs: shell
    if: >-
      github.ref == 'refs/heads/ci-package' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/')
    # Deliberately not a container job, unlike build above. The verification step
    # starts its own `docker run --privileged` to prove the package runs on a
    # machine that never built it, and a job that is itself a container has no
    # docker socket to do that with. Running on the runner host also puts the
    # AppRun mount namespace under the same conditions a user's machine offers.
    # The price is the runner's own glibc, so this measures whether the chain
    # works -- not yet how old a target the package can reach. Building in an
    # ubuntu:22.04 container to lower that floor is the next step, and needs the
    # artefact handed to a separate job for verification.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            archive
          key: appimage-${{ hashFiles('make/**/*.mk', 'Makefile') }}
          restore-keys: |
            appimage-
      - name: Report the ground this runs on
        run: |
          # sed, not head: head closes the pipe after the first line, ldd dies of
          # SIGPIPE and prints two "write error: Broken pipe" lines into the one
          # step whose purpose is to be readable. sed reads its input to the end.
          echo "glibc: $(ldd --version | sed -n 1p)"
          echo "unprivileged userns: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 'no knob (allowed)')"
          unshare --user --map-root-user --mount --propagation private true \
            && echo "userns+mount namespace: usable" \
            || echo "userns+mount namespace: DENIED"
          df -h / | tail -n1
      # DEPS_ALLOW_SUDO because this job, unlike the container ones, does not run
      # as root: setup_deps.sh reports the missing packages instead of
      # installing them, which is right on a workstation and stops a runner
      # dead. Naming the packages here instead would duplicate a list that is
      # already maintained in one place.
      - name: Bootstrap (deps, ffmpeg, libstb-hal, neutrino)
        run: DEPS_ALLOW_SUDO=1 make bootstrap
      - name: Build the AppImage
        run: make package-appimage
      - name: Verify the AppImage
        run: make package-appimage-verify
      # Uploaded even when verification failed: the package is the evidence
      # needed to work out why, and rebuilding it locally takes an hour.
      - name: Upload the AppImage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: artifacts/appimage/*.AppImage
          if-no-files-found: warn
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-logs
          path: |
            **/config.log
            logs/**
          if-no-files-found: ignore
